name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova and Android platform
        run: |
          npm install
          npx cordova platform add android@13
          npx cordova plugin add cordova-plugin-device
          npx cordova plugin add cordova-plugin-file
          npx cordova prepare android

      - name: Apply full-bleed adaptive app icon
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          RES=platforms/android/app/src/main/res
          mkdir -p "$RES/mipmap-anydpi-v26"
          for spec in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $spec
            mkdir -p "$RES/mipmap-$1"
            convert icon.png -resize "$2x$2" "$RES/mipmap-$1/ic_launcher.png"
            convert icon-adaptive.png -resize "$3x$3" "$RES/mipmap-$1/ic_launcher_background.png"
            convert -size "$3x$3" xc:none PNG32:"$RES/mipmap-$1/ic_launcher_foreground.png"
          done
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          ls -R "$RES" | grep -i launcher || true

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-level-up-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
