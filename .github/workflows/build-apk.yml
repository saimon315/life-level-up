name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required files
        shell: bash
        run: |
          missing=0
          for f in config.xml icon.png icon-foreground.png icon-background.png splash_icon.png www/index.html; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; missing=1; fi
          done
          exit $missing

      - name: Install Cordova and Android platform
        shell: bash
        run: |
          npm install
          npx cordova platform add android@13
          npx cordova plugin add cordova-plugin-device
          npx cordova plugin add cordova-plugin-file
          npx cordova prepare android

      - name: Build debug APK
        shell: bash
        run: |
          npx cordova build android --debug --verbose 2>&1 | tee build.log

      - name: Show build result
        if: always()
        shell: bash
        run: |
          echo "---- APK files ----"
          find platforms -name '*.apk' 2>/dev/null || true
          echo "---- last 80 log lines ----"
          tail -n 80 build.log 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-level-up-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
